<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2F — People · Problems · Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0b0c0e;
      --card-bg: #121418;
      --card-hover: #181b22;
      --border-color: #232730;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-glow: rgba(37, 99, 235, 0.18);
      --text-main: #f3f4f6;
      --text-secondary: #9ca3af;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --transition: all 0.2s ease-in-out;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px 40px;
      line-height: 1.5;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header */
    .brand-header {
      text-align: center;
      padding: 12px 0 4px;
    }

    .logo-badge {
      display: inline-block;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
      background: linear-gradient(135deg, #ffffff 60%, #9ca3af 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-slogan {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
      margin-top: 4px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    /* Common Card Styles */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      transition: var(--transition);
    }

    /* Hero */
    .hero-card {
      border-color: rgba(37, 99, 235, 0.25);
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.05) 0%, var(--card-bg) 60%);
    }

    .hero-title {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    .hero-desc {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 13px 18px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid transparent;
      text-decoration: none;
      transition: var(--transition);
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: #ffffff;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-primary:hover, .btn-primary:active {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: transparent;
      border-color: var(--border-color);
      color: var(--text-main);
    }

    .btn-secondary:hover, .btn-secondary:active {
      background-color: var(--card-hover);
      border-color: #3b4252;
    }

    /* Section Headings */
    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 12px;
      padding-left: 2px;
    }

    /* Services Grid */
    .services-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .service-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      background-color: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      transition: var(--transition);
    }

    .service-item:hover {
      background-color: var(--card-hover);
      border-color: #374151;
    }

    .service-icon {
      font-size: 20px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .service-text-wrap {
      display: flex;
      flex-direction: column;
    }

    .service-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .service-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* Direct Contact Links */
    .contact-links-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .contact-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 12px;
      background-color: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      text-decoration: none;
      transition: var(--transition);
    }

    .contact-btn:hover, .contact-btn:active {
      background-color: var(--card-hover);
      border-color: #3b4252;
      transform: translateY(-1px);
    }

    .contact-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .contact-btn.tg svg { fill: #38bdf8; }
    .contact-btn.vk svg { fill: #60a5fa; }

    .contact-title {
      font-size: 13px;
      font-weight: 600;
    }

    .contact-sub {
      font-size: 11px;
      color: var(--text-secondary);
